# TPP-Gaze Phase 2 RETRY: embedding-only, lr=1e-4.
# Entire base frozen; only the 2 x 512 group embedding is trained.
model_cfg_path: tppgaze/data/config.yaml
checkpoint_path: training/runs/baseline/best_model.pth   # Phase 1 best

asd_json: processed_data/asd_scanpaths.json
td_json:  processed_data/td_scanpaths.json
images_dir: /home/user35/gaze-final-project/data/saliency4asd/TrainingData/Images
image_ext: .png

out_dir: training/runs/phase2_embedding_only
split_json: training/runs/baseline/split.json

seed: 0
split: [0.70, 0.15, 0.15]

batch_size: 128
lr: 1.0e-4                 # lowered from 1e-3
weight_decay: 1.0e-1
max_epochs: 300
patience: 20
grad_clip: 5.0
freeze_backbone: true
train_embedding_only: true # freeze ALL base params; optimise only group_emb
cache_backbone: true
num_workers: 0
device: auto

limit_images: null
limit_train_batches: null
limit_val_batches: null
